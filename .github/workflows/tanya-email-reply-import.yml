name: Tanya email reply import

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: tanya-email-reply-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      REPORT_TO: ${{ vars.REPORT_TO || 'mcgillavry@gmail.com' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Import replies
        run: python scripts/cloud_career_checkins.py process-replies
      - name: Commit imported evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tanya/cv-data.json tanya/career-framework/learning-log.md tanya/career-framework/reviews tanya/career-framework/email-replies
          if git diff --cached --quiet; then
            echo "No new email replies to commit"
          else
            git commit -m "chore: import Tanya career check-in reply"
            git pull --rebase origin main
            git push origin main
          fi
